<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Académico</title>
</head>
<body>
  <script type="module">
    import { AuthModule } from './js/modules/auth.module.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthModule.getUser();
      if (user && AuthModule.getToken()) {
        window.location.href = './views/dashboard/dashboard.html';
      } else {
        window.location.href = './views/auth/login.html';
      }
    });
  </script>
</body>
</html>
