<div class="card">
  <!-- Cabecera Adaptable -->
  <div class="header-action">
    <div class="header-title-box">
      <h3 class="header-title">Gestión de Asignaturas</h3>
      <p class="subtitle">Consulta y administración de la carga académica.</p>
    </div>

    <!-- Contenedor Alineado de Filtros y Botón -->
    <div class="header-controls">
      <!-- Combo de Periodo (Visible para Estudiantes según JS) -->
      <div id="filter-periodo-container" class="filter-periodo-wrapper">
        <select id="select-periodo-filtro" class="input-full select-filter">
          <option value="">-- Todos los Periodos --</option>
        </select>
      </div>

      <!-- Campo de Búsqueda Incremental -->
      <input 
        type="text" 
        id="input-search-asignatura" 
        placeholder="Buscar por código, nombre o programa..." 
        class="input-full input-search-filter"
      />

      <!-- Botón Visible solo para ADMIN (Controlado vía JS) -->
      <button id="btn-open-asignatura-create" type="button" class="btn-primary btn-page btn-create-asignatura">
        <i class="fa-solid fa-plus"></i> Nueva Asignatura
      </button>
    </div>
  </div>

  <div id="main-asignatura-alert" class="alert-box" style="display: none;"></div>

  <!-- Contenedor Responsivo para la Tabla -->
  <div class="table-responsive">
    <table class="data-table">
      <thead id="asignaturas-table-head">
        <!-- Renderizado dinámico vía JS según el Rol -->
      </thead>
      <tbody id="asignaturas-table-body">
        <!-- Carga dinámica vía JS -->
      </tbody>
    </table>
  </div>

  <!-- Paginación -->
  <div id="asignaturas-pagination" class="pagination-wrapper"></div>
</div>

<!-- Modal para Crear/Editar Asignatura -->
<div id="asignaturaModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3 id="asignaturaModalTitle">Nueva Asignatura</h3>
    
    <div id="asignatura-modal-alert" class="alert-box alert-error" style="display: none;"></div>

    <form id="asignaturaForm">
      <input type="hidden" id="asignaturaId">

      <div class="field">
        <label for="asignaturaCode">Código de la Asignatura</label>
        <input type="text" id="asignaturaCode" class="input-full" required placeholder="Ej: MAT-101">
      </div>

      <div class="field">
        <label for="asignaturaName">Nombre de la Asignatura</label>
        <input type="text" id="asignaturaName" class="input-full" required placeholder="Ej: Cálculo Diferencial">
      </div>

      <div class="field">
        <label for="asignaturaCreditos">Créditos</label>
        <input type="number" id="asignaturaCreditos" class="input-full" required min="1" max="10" placeholder="Ej: 3">
      </div>

      <!-- Combo Programa Académico -->
      <div class="field">
        <label for="asignaturaPrograma">Programa Académico</label>
        <select id="asignaturaPrograma" class="input-full" required>
          <option value="">-- Seleccione un Programa --</option>
        </select>
      </div>

      <!-- Combo Profesor / Docente -->
      <div class="field">
        <label for="asignaturaDocente">Profesor Asignado</label>
        <select id="asignaturaDocente" class="input-full">
          <option value="">-- Seleccione un Profesor (Opcional) --</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-close-asignatura-modal" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary padding-btn" style="width: auto;">Guardar</button>
      </div>
    </form>
  </div>
</div>
