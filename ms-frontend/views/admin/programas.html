<div class="crud-card">
  <div class="header-action">
    <div class="header-title-box">
      <h2>Gestión de Programas Académicos</h2>
      <p class="subtitle">Administra la oferta de programas académicos de la institución.</p>
    </div>

    <!-- Contenedor alineado horizontalmente -->
    <div class="header-controls">
      <input 
        type="text" 
        id="input-search-program" 
        placeholder="Buscar por código, nombre o facultad..." 
        class="input-full input-search-filter"
      />
      <button type="button" id="btn-open-program-create" class="btn-primary btn-create-program">
        <i class="fa-solid fa-plus"></i> Nuevo Programa
      </button>
    </div>
  </div>

  <div id="main-program-alert" class="alert-box"></div>

  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Código</th>
          <th>Nombre del Programa</th>
          <th>Facultad</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="programs-table-body">
        <tr><td colspan="6" class="text-center">Cargando programas...</td></tr>
      </tbody>
    </table>
  </div>
  <div id="programs-pagination" class="pagination-wrapper"></div>
</div>

<!-- Modal Principal CRUD Programas -->
<div id="programModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="programModalTitle">Crear Programa</h3>
    
    <div id="program-modal-alert" class="alert-box"></div>

    <form id="programForm">
      <input type="hidden" id="programId">
      
      <div class="field">
        <label for="programCode">Código del Programa</label>
        <input type="text" id="programCode" required placeholder="Ej. ING-SIS" class="input-full">
      </div>

      <div class="field">
        <label for="programName">Nombre del Programa</label>
        <input type="text" id="programName" required placeholder="Ej. Ingeniería de Sistemas" class="input-full">
      </div>

      <div class="field">
        <label for="programFacultad">Facultad</label>
        <input type="text" id="programFacultad" required placeholder="Ej. Facultad de Ingeniería" class="input-full">
      </div>

      <div class="field hidden-element margin-b-16" id="programStatusContainer">
        <label class="checkbox-label">
          <input type="checkbox" id="programActive"> Programa Activo
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" id="btn-close-program-modal" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary padding-btn">Guardar Programa</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { ProgramasModule } from '../../js/modules/programas.module.js';
  ProgramasModule.init();
</script>
