<style>
  .crud-card { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin: 20px 0; color: #1f2937; }
  .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
  .data-table th { background-color: #f9fafb; color: #374151; font-weight: 600; }
  .badge-active { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
  .badge-inactive { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
  .modal-content { background: #fff; width: 100%; max-width: 480px; padding: 24px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); color: #1f2937; max-height: 90vh; overflow-y: auto; }
  .action-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: background 0.2s; }
  .action-btn:hover { background: #f3f4f6; }
  .btn-edit { color: #2563eb; }
  .btn-delete { color: #dc2626; }
  .alert-box { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
  .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  .btn-secondary:hover { background: #e5e7eb; }
</style>

<div class="crud-card">
  <div class="header-action">
    <div>
      <h2 style="margin: 0;">Gestión de Programas Académicos</h2>
      <p style="color: #6b7280; font-size: 14px; margin: 4px 0 0 0;">Administra la oferta de programas académicos de la institución.</p>
    </div>
    <button type="button" class="btn-primary" onclick="window.openProgramModal()"><i class="fa-solid fa-plus"></i> Nuevo Programa</button>
  </div>

  <div id="main-program-alert" class="alert-box"></div>

  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Código</th>
        <th>Nombre del Programa</th>
        <th>Facultad</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="programs-table-body">
      <tr><td colspan="6" style="text-align:center;">Cargando programas...</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal Principal CRUD Programas -->
<div id="programModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="programModalTitle" style="margin-bottom: 12px; margin-top: 0;">Crear Programa</h3>
    
    <div id="program-modal-alert" class="alert-box"></div>

    <form id="programForm">
      <input type="hidden" id="programId">
      
      <div class="field" style="margin-bottom: 12px;">
        <label for="programCode">Código del Programa</label>
        <input type="text" id="programCode" required placeholder="Ej. ING-SIS" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>

      <div class="field" style="margin-bottom: 12px;">
        <label for="programName">Nombre del Programa</label>
        <input type="text" id="programName" required placeholder="Ej. Ingeniería de Sistemas" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>

      <div class="field" style="margin-bottom: 12px;">
        <label for="programFacultad">Facultad</label>
        <input type="text" id="programFacultad" required placeholder="Ej. Facultad de Ingeniería" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>

      <div class="field" id="programStatusContainer" style="display:none; margin-bottom: 16px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="programActive"> Programa Activo
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button type="button" onclick="window.closeProgramModal()" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary" style="padding: 8px 16px;">Guardar Programa</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import ProgramasModule from '/js/modules/programas.module.js';

  async function loadData() {
    try {
      const data = await ProgramasModule.getProgramas();
      renderTable(data);
    } catch (err) {
      console.error('Error al cargar datos:', err);
      showMainAlert(err.message, true);
    }
  }

  function renderTable(programas) {
    const tbody = document.getElementById('programs-table-body');
    if (!tbody) return;

    if (!programas || !programas.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No existen programas registrados.</td></tr>';
      return;
    }

    tbody.innerHTML = programas.map(p => {
      const isActivo = p.activo !== undefined ? p.activo : true;
      const statusBadge = isActivo 
        ? '<span class="badge-active">Activo</span>' 
        : '<span class="badge-inactive">Inactivo</span>';

      return `
        <tr>
          <td>${p.id}</td>
          <td><b>${p.codigo || 'N/A'}</b></td>
          <td>${p.nombre}</td>
          <td>${p.facultad || 'N/A'}</td>
          <td>${statusBadge}</td>
          <td>
            <button class="action-btn btn-edit" onclick='window.openEditProgramModal(${JSON.stringify(p)})' title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" onclick='window.deleteProgram(${p.id})' title="Eliminar"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    }).join('');
  }

  window.openProgramModal = function() {
    hideModalAlert();
    const form = document.getElementById('programForm');
    if (form) form.reset();
    
    const idInput = document.getElementById('programId');
    if (idInput) idInput.value = '';

    const title = document.getElementById('programModalTitle');
    if (title) title.innerText = 'Crear Nuevo Programa';

    const statusContainer = document.getElementById('programStatusContainer');
    if (statusContainer) statusContainer.style.display = 'none';

    const modal = document.getElementById('programModal');
    if (modal) modal.style.display = 'flex';
  };

  window.openEditProgramModal = function(program) {
    hideModalAlert();
    const form = document.getElementById('programForm');
    if (form) form.reset();

    const title = document.getElementById('programModalTitle');
    if (title) title.innerText = 'Editar Programa';

    document.getElementById('programId').value = program.id;
    document.getElementById('programCode').value = program.codigo || '';
    document.getElementById('programName').value = program.nombre || '';
    document.getElementById('programFacultad').value = program.facultad || '';
    
    const statusContainer = document.getElementById('programStatusContainer');
    if (statusContainer) statusContainer.style.display = 'block';

    const activeCheckbox = document.getElementById('programActive');
    if (activeCheckbox) activeCheckbox.checked = Boolean(program.activo);

    const modal = document.getElementById('programModal');
    if (modal) modal.style.display = 'flex';
  };

  window.closeProgramModal = function() {
    hideModalAlert();
    const modal = document.getElementById('programModal');
    if (modal) modal.style.display = 'none';
  };

  const programForm = document.getElementById('programForm');
  if (programForm) {
    programForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideModalAlert();

      const id = document.getElementById('programId').value;
      const payload = {
        codigo: document.getElementById('programCode').value,
        nombre: document.getElementById('programName').value,
        facultad: document.getElementById('programFacultad').value,
        activo: document.getElementById('programActive') ? document.getElementById('programActive').checked : true
      };

      try {
        if (id) {
          await ProgramasModule.updatePrograma(id, payload);
          showMainAlert('Programa actualizado exitosamente');
        } else {
          await ProgramasModule.createPrograma(payload);
          showMainAlert('Programa creado exitosamente');
        }
        window.closeProgramModal();
        loadData();
      } catch (err) {
        showModalAlert(err.message, true);
      }
    });
  }

  window.deleteProgram = async function(id) {
    if (!confirm('¿Está seguro de que desea inactivar este programa?')) return;
    try {
      await ProgramasModule.deletePrograma(id);
      showMainAlert('Programa inactivado exitosamente');
      loadData();
    } catch (err) {
      showMainAlert(err.message, true);
    }
  };

  function showModalAlert(msg, isError = false) {
    const alertBox = document.getElementById('program-modal-alert');
    if (!alertBox) return;
    alertBox.innerText = msg;
    alertBox.className = `alert-box ${isError ? 'alert-error' : 'alert-success'}`;
    alertBox.style.display = 'block';
  }

  function hideModalAlert() {
    const alertBox = document.getElementById('program-modal-alert');
    if (alertBox) alertBox.style.display = 'none';
  }

  function showMainAlert(msg, isError = false) {
    const alertBox = document.getElementById('main-program-alert');
    if (!alertBox) return;
    alertBox.innerText = msg;
    alertBox.className = `alert-box ${isError ? 'alert-error' : 'alert-success'}`;
    alertBox.style.display = 'block';
    setTimeout(() => { if (alertBox) alertBox.style.display = 'none'; }, 4000);
  }

  loadData();
</script>
