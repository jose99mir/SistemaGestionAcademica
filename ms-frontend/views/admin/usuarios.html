<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Usuarios — Portal Académico</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .crud-card { background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin: 20px; color: #1f2937; }
    .header-action { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    .data-table th { background-color: #f9fafb; color: #374151; font-weight: 600; }
    .badge-role { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; margin-right: 4px; }
    .badge-active { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    .badge-inactive { background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: #fff; width: 100%; max-width: 480px; padding: 24px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); color: #1f2937; max-height: 90vh; overflow-y: auto; }
    .roles-checkbox-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; padding: 10px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 6px; }
    .roles-checkbox-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
    .action-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 4px; transition: background 0.2s; }
    .action-btn:hover { background: #f3f4f6; }
    .btn-edit { color: #2563eb; }
    .btn-delete { color: #dc2626; }
    .alert-box { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; display: none; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-secondary:hover { background: #e5e7eb; }
  </style>
</head>
<body>

<div class="crud-card">
  <div class="header-action">
    <div>
      <h2 style="margin: 0;">Gestión Global de Usuarios</h2>
      <p style="color: #6b7280; font-size: 14px; margin: 4px 0 0 0;">Administra accesos, roles y contraseñas de los usuarios.</p>
    </div>
    <button class="btn-primary" onclick="openCreateModal()"><i class="fa-solid fa-user-plus"></i> Nuevo Usuario</button>
  </div>

  <div id="main-alert" class="alert-box"></div>

  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Correo Electrónico</th>
        <th>Roles Asignados</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="users-table-body">
      <tr><td colspan="6" style="text-align:center;">Cargando usuarios...</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal Principal CRUD -->
<div id="userModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-bottom: 12px; margin-top: 0;">Crear Usuario</h3>
    
    <div id="modal-alert" class="alert-box"></div>

    <form id="userForm">
      <input type="hidden" id="userId">
      
      <div class="field" style="margin-bottom: 12px;">
        <label for="userName">Nombre Completo</label>
        <input type="text" id="userName" required placeholder="Ej. Juan Pérez" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>
      
      <div class="field" style="margin-bottom: 12px;">
        <label for="userEmail">Correo Electrónico</label>
        <input type="email" id="userEmail" required placeholder="usuario@unicomfacauca.edu.co" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>

      <!-- Campos de Contraseña para modo Creación -->
      <div id="creationPasswordFields">
        <div class="field" style="margin-bottom: 12px;">
          <label for="userPassword">Contraseña</label>
          <input type="password" id="userPassword" placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>

        <div class="field" style="margin-bottom: 12px;">
          <label for="userConfirmPassword">Confirmar Contraseña</label>
          <input type="password" id="userConfirmPassword" placeholder="Repite la contraseña" style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
      </div>

      <!-- Botón independiente para Cambiar Contraseña en modo Edición -->
      <div id="editPasswordBtnContainer" style="display:none; margin-bottom: 16px;">
        <button type="button" class="btn-secondary" onclick="openPassModal()" style="width: 100%; text-align: center;">
          <i class="fa-solid fa-key"></i> Actualizar Contraseña de este Usuario
        </button>
      </div>

      <div class="field" style="margin-bottom: 12px;">
        <label>Asignación de Roles</label>
        <div id="rolesChecklist" class="roles-checkbox-group"></div>
      </div>

      <div class="field" id="statusContainer" style="display:none; margin-bottom: 16px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="userActive"> Usuario Activo en el Sistema
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button type="button" onclick="closeUserModal()" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary" style="padding: 8px 16px;">Guardar Usuario</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Independiente para Cambiar Contraseña -->
<div id="passModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-bottom: 4px; margin-top: 0;">Actualizar Contraseña</h3>
    <p style="font-size: 13px; color: #6b7280; margin-bottom: 12px;">Establece una nueva clave de acceso para el usuario seleccionado.</p>
    
    <div id="pass-modal-alert" class="alert-box"></div>

    <form id="passForm">
      <div class="field" style="margin-bottom: 12px;">
        <label for="newPassword">Nueva Contraseña</label>
        <input type="password" id="newPassword" required placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>

      <div class="field" style="margin-bottom: 16px;">
        <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirmNewPassword" required placeholder="Repite la nueva contraseña" style="width: 100%; padding: 8px; margin-top: 4px;">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" onclick="closePassModal()" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary" style="padding: 8px 16px;">Actualizar Clave</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
  import { UsersModule } from '../../js/modules/users.module.js';

  let availableRoles = [];
  let currentEditingUserId = null;

  async function loadData() {
    try {
      const data = await UsersModule.getUsers();
      availableRoles = data.roles || [];
      renderRolesChecklist();
      renderTable(data.users || []);
    } catch (err) {
      showMainAlert(err.message, true);
    }
  }

  function renderTable(users) {
    const tbody = document.getElementById('users-table-body');
    if (!users.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No existen usuarios registrados.</td></tr>';
      return;
    }

    tbody.innerHTML = users.map(u => {
      const roleBadges = u.roles 
        ? u.roles.split(', ').map(r => `<span class="badge-role">${r}</span>`).join('') 
        : '<span style="color:#9ca3af;">Sin Rol</span>';
      
      const statusBadge = u.activo 
        ? '<span class="badge-active">Activo</span>' 
        : '<span class="badge-inactive">Inactivo</span>';

      return `
        <tr>
          <td>${u.id}</td>
          <td><b>${u.nombre}</b></td>
          <td>${u.email}</td>
          <td>${roleBadges}</td>
          <td>${statusBadge}</td>
          <td>
            <button class="action-btn btn-edit" onclick='openEditModal(${JSON.stringify(u)})' title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" onclick='deleteUser(${u.id})' title="Eliminar"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function renderRolesChecklist() {
    const container = document.getElementById('rolesChecklist');
    container.innerHTML = availableRoles.map(r => `
      <label>
        <input type="checkbox" name="roles" value="${r.id}"> ${r.nombre}
      </label>
    `).join('');
  }

  window.openCreateModal = function() {
    hideModalAlert();
    currentEditingUserId = null;
    document.getElementById('userForm').reset();
    document.getElementById('userId').value = '';
    document.getElementById('modalTitle').innerText = 'Crear Nuevo Usuario';
    
    document.getElementById('creationPasswordFields').style.display = 'block';
    document.getElementById('userPassword').required = true;
    document.getElementById('userConfirmPassword').required = true;
    document.getElementById('editPasswordBtnContainer').style.display = 'none';
    document.getElementById('statusContainer').style.display = 'none';
    
    document.getElementById('userModal').style.display = 'flex';
  };

  window.openEditModal = function(user) {
    hideModalAlert();
    currentEditingUserId = user.id;
    document.getElementById('userForm').reset();
    document.getElementById('modalTitle').innerText = 'Editar Usuario';
    document.getElementById('userId').value = user.id;
    document.getElementById('userName').value = user.nombre;
    document.getElementById('userEmail').value = user.email;
    
    document.getElementById('creationPasswordFields').style.display = 'none';
    document.getElementById('userPassword').required = false;
    document.getElementById('userConfirmPassword').required = false;
    document.getElementById('editPasswordBtnContainer').style.display = 'block';
    document.getElementById('statusContainer').style.display = 'block';
    document.getElementById('userActive').checked = Boolean(user.activo);

    const selectedIds = user.roles_ids ? user.roles_ids.toString().split(',').map(id => id.trim()) : [];
    document.querySelectorAll('input[name="roles"]').forEach(cb => {
      cb.checked = selectedIds.includes(cb.value.toString());
    });

    document.getElementById('userModal').style.display = 'flex';
  };

  window.closeUserModal = function() {
    hideModalAlert();
    document.getElementById('userModal').style.display = 'none';
  };

  // Abrir y cerrar modal independiente de contraseña sin solapamiento
  window.openPassModal = function() {
    document.getElementById('passForm').reset();
    hidePassAlert();
    document.getElementById('userModal').style.display = 'none';
    document.getElementById('passModal').style.display = 'flex';
  };

  window.closePassModal = function() {
    hidePassAlert();
    document.getElementById('passModal').style.display = 'none';
    document.getElementById('userModal').style.display = 'flex';
  };

  // Guardar datos generales del usuario
  document.getElementById('userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideModalAlert();

    const id = document.getElementById('userId').value;
    const selectedRoles = Array.from(document.querySelectorAll('input[name="roles"]:checked')).map(cb => Number(cb.value));

    if (selectedRoles.length === 0) {
      showModalAlert('Debes seleccionar al menos un rol para el usuario.', true);
      return;
    }

    const payload = {
      nombre: document.getElementById('userName').value,
      email: document.getElementById('userEmail').value,
      roles: selectedRoles,
      activo: document.getElementById('userActive').checked
    };

    if (!id) {
      const password = document.getElementById('userPassword').value;
      const confirmPassword = document.getElementById('userConfirmPassword').value;

      if (!password) {
        showModalAlert('La contraseña es obligatoria para usuarios nuevos.', true);
        return;
      }
      if (password !== confirmPassword) {
        showModalAlert('Las contraseñas no coinciden. Por favor verifícalas.', true);
        return;
      }
      if (password.length < 6) {
        showModalAlert('La contraseña debe tener al menos 6 caracteres.', true);
        return;
      }
      payload.password = password;
    }

    try {
      if (id) {
        await UsersModule.updateUser(id, payload);
        showMainAlert('Datos del usuario actualizados exitosamente');
      } else {
        await UsersModule.createUser(payload);
        showMainAlert('Usuario creado exitosamente');
      }
      closeUserModal();
      loadData();
    } catch (err) {
      showModalAlert(err.message, true);
    }
  });

  // Guardar cambio de contraseña exclusivo
  document.getElementById('passForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hidePassAlert();

    const newPassword = document.getElementById('newPassword').value;
    const confirmNewPassword = document.getElementById('confirmNewPassword').value;

    if (newPassword !== confirmNewPassword) {
      showPassAlert('Las contraseñas no coinciden. Por favor verifícalas.', true);
      return;
    }

    if (newPassword.length < 6) {
      showPassAlert('La contraseña debe tener al menos 6 caracteres.', true);
      return;
    }

    try {
      await UsersModule.updateUserPassword(currentEditingUserId, newPassword);
      showMainAlert('Contraseña actualizada correctamente');
      document.getElementById('passModal').style.display = 'none';
      loadData();
    } catch (err) {
      showPassAlert(err.message, true);
    }
  });

  window.deleteUser = async function(id) {
    if (!confirm('¿Está seguro de que desea eliminar este usuario?')) return;
    try {
      await UsersModule.deleteUser(id);
      showMainAlert('Usuario eliminado exitosamente');
      loadData();
    } catch (err) {
      showMainAlert(err.message, true);
    }
  };

  function showModalAlert(msg, isError = false) {
    const alertBox = document.getElementById('modal-alert');
    alertBox.innerText = msg;
    alertBox.className = `alert-box ${isError ? 'alert-error' : 'alert-success'}`;
    alertBox.style.display = 'block';
  }

  function hideModalAlert() {
    document.getElementById('modal-alert').style.display = 'none';
  }

  function showPassAlert(msg, isError = false) {
    const alertBox = document.getElementById('pass-modal-alert');
    alertBox.innerText = msg;
    alertBox.className = `alert-box ${isError ? 'alert-error' : 'alert-success'}`;
    alertBox.style.display = 'block';
  }

  function hidePassAlert() {
    document.getElementById('pass-modal-alert').style.display = 'none';
  }

  function showMainAlert(msg, isError = false) {
    const alertBox = document.getElementById('main-alert');
    alertBox.innerText = msg;
    alertBox.className = `alert-box ${isError ? 'alert-error' : 'alert-success'}`;
    alertBox.style.display = 'block';
    setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
  }

  loadData();
</script>
</body>
</html>
