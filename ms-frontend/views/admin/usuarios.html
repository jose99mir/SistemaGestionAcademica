<div class="card">
  <!-- Cabecera adaptable -->
  <div class="card-header-flex">
    <div>
      <h3 style="margin: 0;">Gestión Global de Usuarios</h3>
      <p style="margin: 5px 0 0 0; color: #6b7280; font-size: 0.9rem;">
        Administra accesos, roles y contraseñas de los usuarios.
      </p>
    </div>
    <button id="btn-open-modal" class="btn-primary">
      <i class="fa-solid fa-user-plus"></i> Nuevo Usuario
    </button>
  </div>

  <!-- Alertas del módulo -->
  <div id="main-user-alert" class="alert-box" style="display: none;"></div>

  <!-- Contenedor con scroll horizontal para la tabla -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Correo Electrónico</th>
          <th>Roles Asignados</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <!-- Renderizado dinámico vía UsersModule -->
      </tbody>
    </table>
  </div>

  <!-- Contenedor del Paginador -->
  <div id="users-pagination" class="pagination-wrapper"></div>
</div>
