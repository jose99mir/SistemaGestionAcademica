<div class="card">
  <!-- Cabecera idéntica a Programas -->
  <div class="header-action">
    <div>
      <h3 style="margin: 0;">Gestión Global de Usuarios</h3>
      <p style="margin: 5px 0 0 0; color: var(--muted); font-size: 0.9rem;">
        Administra accesos, roles y contraseñas de los usuarios.
      </p>
    </div>
    <button id="btn-open-modal" class="btn-navy" style="width: auto;">
      <i class="fa-solid fa-user-plus"></i> Nuevo Usuario
    </button>
  </div>

  <!-- Alerta del módulo -->
  <div id="main-user-alert" class="alert-box" style="display: none;"></div>

  <!-- Contenedor adaptable para evitar desbordamientos -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Usuario</th>
          <th>Correo Electrónico</th>
          <th>Roles Asignados</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <!-- Cargado por JS -->
      </tbody>
    </table>
    <div id="users-pagination" class="pagination-wrapper"></div>
  </div>
</div>
