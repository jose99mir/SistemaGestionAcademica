<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Unicomfacauca — Iniciar Sesión</title>

  <!-- Rutas relativas corregidas desde views/auth/ hacia assets/ -->
  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="badge">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <div>
        <h2>UNICOMFACAUCA</h2>
        <p>Portal Académico</p>
      </div>
    </div>

    <h2>Iniciar sesión</h2>
    <p class="sub">Ingresa con tus credenciales institucionales.</p>

    <!-- Contenedor dinámico de alertas de error -->
   <div id="error-message" class="alert-error-box"></div>

    <!-- Selección de rol mediante Pestañas -->
    <div class="role-tabs" id="role-tabs">
      <button id="tab-estudiante" class="role-btn active" type="button" data-role="ESTUDIANTE">Estudiante</button>
      <button id="tab-profesor" class="role-btn" type="button" data-role="DOCENTE">Profesor</button>
      <button id="tab-admin" class="role-btn" type="button" data-role="ADMIN">Administrador</button>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="login-email">Correo institucional</label>
        <input id="login-email" type="email" required placeholder="usuario@unicomfacauca.edu.co">
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input id="login-password" type="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary">Ingresar</button>
    </form>

    <div class="demo-note" id="role-hint">Selecciona tu rol para ingresar al portal correspondiente.</div>
  </div>
</div>

<!-- Scripts locales -->
<script src="../../assets/js/bootstrap.bundle.min.js"></script>

<!-- Importación corregida subiendo dos niveles (../../js/modules/auth.module.js) -->
<script type="module">
  import { AuthModule } from '../../js/modules/auth.module.js';

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => AuthModule.initLoginPage());
  } else {
    AuthModule.initLoginPage();
  }
</script>

</body>
</html>
