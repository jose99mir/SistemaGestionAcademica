<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Unicomfacauca — Dashboard</title>

  <!-- CSS Locales -->
  <link rel="stylesheet" href="../../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body>

<div id="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="sb-logo">
        <div class="badge">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h2>UNICOMFACAUCA</h2>
          <p id="sb-subtitle">Portal Académico</p>
        </div>
      </div>

      <div class="sb-user">
        <div class="avatar" id="sb-avatar">U</div>
        <div>
          <div class="name" id="sb-name">Usuario</div>
          <div class="role" id="sb-role">Cargando...</div>
        </div>
      </div>

      <nav class="sb-menu" id="sb-menu"></nav>
    </div>

    <button class="sb-logout" id="btnLogout">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión
    </button>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="content">
    <div class="topbar">
      <div>
        <h1 id="page-title">Bienvenido</h1>
        <p id="page-sub">Cargando información del sistema...</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" type="button">
          <i class="fa-regular fa-bell"></i>
        </button>
        <div class="pill" id="current-date"></div>
      </div>
    </div>

    <div id="page-container"></div>
  </main>
</div>

<!-- JS de Bootstrap Local -->
<script src="../../assets/js/bootstrap.bundle.min.js"></script>

<!-- Módulo Principal del Dashboard -->
<script type="module">
  import DashboardModule from '../../js/modules/dashboard.module.js';

  document.addEventListener('DOMContentLoaded', () => {
    DashboardModule.init();
  });
</script>

</body>
</html>
