<div class="card">
  <div class="header-action">
    <div>
      <h3 style="margin: 0;">Soporte Técnico y PQRS</h3>
      <p style="margin: 5px 0 0 0; color: var(--muted); font-size: 0.9rem;">
        Gestión de Peticiones, Quejas, Reclamos y Sugerencias.
      </p>
    </div>
    <button id="btn-open-create-pqr" class="btn-navy" style="width: auto;">
      <i class="fa-solid fa-plus"></i> Nueva PQR
    </button>
  </div>

  <div id="soporte-main-alert" class="alert-box alert-error" style="display: none; margin-bottom: 15px;"></div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Documento</th>
          <th>Tipo</th>
          <th>Asunto</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="pqr-table-body">
        <!-- JS Dynamic Data -->
      </tbody>
    </table>
    <div id="pqr-pagination" class="pagination-wrapper"></div>
  </div>
</div>

<!-- Modal Registrar PQR -->
<div id="createPqrModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3>Nueva PQR</h3>
    <div id="create-pqr-alert" class="alert-box alert-error" style="display: none; margin-bottom: 15px;"></div>
    
    <form id="createPqrForm">
      <div class="field">
        <label for="pqrTipo">Tipo</label>
        <select id="pqrTipo" required>
          <option value="PETICION">PETICION</option>
          <option value="QUEJA">QUEJA</option>
          <option value="RECLAMO">RECLAMO</option>
          <option value="SUGERENCIA">SUGERENCIA</option>
        </select>
      </div>

      <div class="field">
        <label for="pqrAsunto">Asunto</label>
        <input type="text" id="pqrAsunto" required placeholder="Escribe el asunto del requerimiento">
      </div>

      <div class="field">
        <label for="pqrDescripcion">Descripción</label>
        <textarea id="pqrDescripcion" rows="4" style="width: 100%; border-radius: 8px; border: 1px solid #d1d5db; padding: 8px;" required placeholder="Detalla tu requerimiento..."></textarea>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" id="btn-close-create-modal" class="btn-navy" style="background: var(--muted, #6b7280);">Cancelar</button>
        <button type="submit" class="btn-navy">Enviar PQR</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Ver / Responder PQR -->
<div id="viewPqrModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3 id="viewPqrTitle">Detalle PQR</h3>
    <div id="view-pqr-alert" class="alert-box alert-error" style="display: none; margin-bottom: 15px;"></div>

    <div style="margin-bottom: 15px;">
      <p style="margin: 0; font-weight: bold; color: var(--muted);">Usuario / Documento:</p>
      <p id="viewPqrUser" style="margin: 2px 0 10px 0;"></p>

      <p style="margin: 0; font-weight: bold; color: var(--muted);">Asunto:</p>
      <p id="viewPqrAsunto" style="margin: 2px 0 10px 0;"></p>

      <p style="margin: 0; font-weight: bold; color: var(--muted);">Descripción:</p>
      <div id="viewPqrDescripcion" style="background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid #e5e7eb; margin-top: 2px;"></div>
    </div>

    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 15px 0;">

    <!-- Modo lectura para Estudiante / Docente -->
    <div id="userResponseContainer">
      <p style="margin: 0; font-weight: bold; color: var(--muted);">Respuesta Institucional:</p>
      <div id="viewPqrRespuesta" style="padding: 10px; border-radius: 6px; margin-top: 5px;"></div>
    </div>

    <!-- Modo administración para Admin -->
    <div id="adminResponseFormContainer" style="display: none;">
      <form id="adminResponseForm">
        <input type="hidden" id="adminPqrId">
        <div class="field">
          <label for="adminRespuestaText">Respuesta de Soporte</label>
          <textarea id="adminRespuestaText" rows="4" style="width: 100%; border-radius: 8px; border: 1px solid #d1d5db; padding: 8px;" required placeholder="Redactar la respuesta oficial..."></textarea>
        </div>
        <div class="field">
          <label for="adminPqrEstado">Estado de la PQR</label>
          <select id="adminPqrEstado">
            <option value="RESUELTO">RESUELTO</option>
            <option value="EN_PROCESO">EN_PROCESO</option>
            <option value="RECHAZADO">RECHAZADO</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px;">
          <button type="submit" class="btn-navy">Guardar Respuesta</button>
        </div>
      </form>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
      <button type="button" id="btn-close-view-modal" class="btn-navy" style="background: var(--muted, #6b7280);">Cerrar</button>
    </div>
  </div>
</div>
