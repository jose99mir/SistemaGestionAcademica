<div class="card">
  <!-- Cabecera exacta -->
  <div class="header-action">
    <div>
      <h3 style="margin: 0;">Gestión Global de Usuarios</h3>
      <p style="margin: 5px 0 0 0; color: var(--muted); font-size: 0.9rem;">
        Administra accesos, roles y contraseñas de los usuarios.
      </p>
    </div>
    <button id="btn-open-create" class="btn-navy" style="width: auto;">
      <i class="fa-solid fa-user-plus"></i> Nuevo Usuario
    </button>
  </div>

  <!-- Alerta del módulo -->
  <div id="main-alert" class="alert-box" style="display: none;"></div>

  <!-- Contenedor adaptable -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Documento</th>
          <th>Usuario</th>
          <th>Correo Electrónico</th>
          <th>Roles Asignados</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="users-table-body">
        <!-- Cargado por JS -->
      </tbody>
    </table>
    <div id="users-pagination" class="pagination-wrapper"></div>
  </div>
</div>

<!-- MODAL DE USUARIO -->
<div id="userModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3 id="modalTitle">Crear Nuevo Usuario</h3>
    <div id="modal-alert" class="alert-box" style="display: none; margin-bottom: 10px;"></div>
    
    <form id="userForm">
      <input type="hidden" id="userId">
      
      <div class="field">
        <label for="userTipoDocumento">Tipo de Documento</label>
        <select id="userTipoDocumento" required>
          <option value="CC">Cédula de Ciudadanía (CC)</option>
          <option value="TI">Tarjeta de Identidad (TI)</option>
          <option value="CE">Cédula de Extranjería (CE)</option>
          <option value="PASAPORTE">Pasaporte</option>
        </select>
      </div>

      <div class="field">
        <label for="userDocumento">Número de Documento</label>
        <input type="text" id="userDocumento" required placeholder="Número de documento">
      </div>

      <div class="field">
        <label for="userName">Nombre Completo</label>
        <input type="text" id="userName" required placeholder="Nombre completo">
      </div>

      <div class="field">
        <label for="userEmail">Correo Electrónico</label>
        <input type="email" id="userEmail" required placeholder="correo@ejemplo.com">
      </div>

      <div id="creationPasswordFields">
        <div class="field">
          <label for="userPassword">Contraseña</label>
          <input type="password" id="userPassword" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="field">
          <label for="userConfirmPassword">Confirmar Contraseña</label>
          <input type="password" id="userConfirmPassword" placeholder="Confirmar contraseña">
        </div>
      </div>

      <div id="editPasswordBtnContainer" style="display: none; margin-bottom: 15px;">
        <button type="button" id="btn-open-pass-modal" class="btn-navy" style="background: var(--muted, #6b7280);">
          <i class="fa-solid fa-key"></i> Cambiar Contraseña
        </button>
      </div>

      <div class="field">
        <label>Roles del Usuario</label>
        <div id="rolesChecklist" style="margin-top: 5px;"></div>
      </div>

      <div id="statusContainer" class="field" style="display: none;">
        <label style="cursor: pointer;">
          <input type="checkbox" id="userActive"> Usuario Activo
        </label>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" id="btn-close-user-modal" class="btn-navy" style="background: var(--muted, #6b7280);">Cancelar</button>
        <button type="submit" class="btn-navy">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL CAMBIO DE CONTRASEÑA -->
<div id="passModal" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h3>Cambiar Contraseña</h3>
    <div id="pass-modal-alert" class="alert-box" style="display: none; margin-bottom: 10px;"></div>
    
    <form id="passForm">
      <div class="field">
        <label for="newPassword">Nueva Contraseña</label>
        <input type="password" id="newPassword" required placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field">
        <label for="confirmNewPassword">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirmNewPassword" required placeholder="Confirmar contraseña">
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" id="btn-close-pass-modal" class="btn-navy" style="background: var(--muted, #6b7280);">Cancelar</button>
        <button type="submit" class="btn-navy">Actualizar Contraseña</button>
      </div>
    </form>
  </div>
</div>
